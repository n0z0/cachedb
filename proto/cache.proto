syntax = "proto3";

package cache;

option go_package = "/cachepb";

service Cache {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Set(SetRequest) returns (SetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc MGet(MGetRequest) returns (MGetResponse);
  rpc MSet(MSetRequest) returns (MSetResponse);
  rpc GetStats(StatsRequest) returns (StatsResponse);
  rpc GetActor(ActorRequest) returns (ActorResponse);
  rpc ListActors(ListActorsRequest) returns (ListActorsResponse);
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bytes value = 1;
  bool found = 2;
}

message SetRequest {
  string key = 1;
  bytes value = 2;
  int32 ttl_seconds = 3; // 0 = default server TTL
}

message SetResponse {
  bool ok = 1;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool ok = 1;
}

message MGetRequest {
  repeated string keys = 1;
}

message KeyValueItem {
  string key = 1;
  bytes value = 2;
  bool found = 3;
}

message MGetResponse {
  repeated KeyValueItem items = 1;
}

message SetItem {
  string key = 1;
  bytes value = 2;
  int32 ttl_seconds = 3; // 0 = default server TTL
}

message MSetRequest {
  repeated SetItem items = 1;
}

message MSetResponse {
  int32 count = 1;
  bool ok = 2;
}

message StatsRequest {}

message StatsResponse {
  int64 entry_count = 1;
  int64 hit_count = 2;
  int64 miss_count = 3;
  double hit_rate = 4;
  int64 evacuate_count = 5;
  int64 expired_count = 6;
  int64 memory_limit_bytes = 7;
}

message ActorRequest {
  string ip = 1;
}

message ActorDossier {
  string ip = 1;
  string knock_port = 2;
  string syn_hash = 3;
  string risk_score = 4;
  string severity = 5;
  string target_service = 6;
  string intent_category = 7;
  string scan_velocity = 8;
  string estimated_os = 9;
  string scanner_tool = 10;
  string scan_hits = 11;
  string last_activity = 12;
  string file_author = 13;
  string file_software = 14;
}

message ActorResponse {
  bool found = 1;
  ActorDossier dossier = 2;
}

message ListActorsRequest {}

message ListActorsResponse {
  repeated ActorDossier actors = 1;
  int32 total_count = 2;
}
